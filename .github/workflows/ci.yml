name: PRISM CI Pipeline

on:
  push:
    branches: [ "main", "devops" ]
  pull_request:
    branches: [ "main" ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff

    - name: Lint with Ruff
      run: |
        # Stop the build if there are syntax errors or undefined names
        ruff check . --select=E9,F63,F7,F82 --output-format=github

    - name: Run Baseline Benchmarks (Integration Test)
      run: |
        # If this script crashes, the pipeline fails
        python -m experiments.baseline_comparison